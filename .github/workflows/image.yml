name: Build image

# Chỉ chạy tay (người có quyền ghi repo). Repo public + runner riêng: PR từ fork vẫn có thể sửa workflow để nhắm nhãn
# vps-apps-image; chặn duy nhất là repo bắt duyệt tay mọi PR của người ngoài (all_external_contributors) —
# đọc kỹ thay đổi .github/workflows/** trước khi bấm "Approve and run".
on:
  workflow_dispatch:
    inputs:
      app:
        description: Thư mục trong images/ (vd. nod)
        required: true
      ref:
        description: Tag của dự án gốc (vd. nod-v0.9.7)
        required: true

permissions:
  contents: read
  packages: write

concurrency: image-${{ inputs.app }}

jobs:
  build:
    runs-on: [self-hosted, vps-apps-image]  # gh-runner-vps-apps trên máy gh-runner-tinovn
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Đăng nhập ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build và đẩy
        shell: bash  # -eo pipefail: build lỗi thì bước đỏ dù có `| tee`
        env:
          APP: ${{ inputs.app }}
          REF: ${{ inputs.ref }}
        run: |
          [[ $APP =~ ^[a-z0-9-]+$ && -x images/$APP/build.sh ]] || { echo "không có images/$APP/build.sh"; exit 1; }
          "images/$APP/build.sh" "$REF" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Đăng xuất ghcr.io
        if: always()
        run: docker logout ghcr.io
